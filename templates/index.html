<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Caption</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                #0f172a;

            min-height: 100vh;

            color: #e5e7eb;
        }


        .app {

            width: min(
                100%,
                1000px
            );

            margin: auto;

            min-height: 100vh;

            display: flex;

            flex-direction: column;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .header {

            position: sticky;

            top: 0;

            z-index: 10;

            background:
                #111827;

            border-bottom:
                1px solid #263244;

            padding:
                16px 20px;
        }


        .header-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;
        }


        .title {

            font-size: 1.35rem;

            font-weight: 700;

            color: white;
        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 0.9rem;

            font-weight: 600;
        }


        .status-dot {

            width: 11px;

            height: 11px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px
                rgba(
                    34,
                    197,
                    94,
                    0.6
                );
        }


        .status-dot.transcribing {

            background: #f59e0b;

            box-shadow:
                0 0 10px
                rgba(
                    245,
                    158,
                    11,
                    0.6
                );

            animation:
                pulse 1s infinite;
        }


        .status-dot.paused {

            background: #60a5fa;

            box-shadow:
                0 0 10px
                rgba(
                    96,
                    165,
                    250,
                    0.6
                );
        }


        .status-dot.error {

            background: #ef4444;

            box-shadow:
                0 0 10px
                rgba(
                    239,
                    68,
                    68,
                    0.6
                );
        }


        @keyframes pulse {

            0%,
            100% {
                transform:
                    scale(1);
            }

            50% {
                transform:
                    scale(1.3);
            }
        }


        /* ==================================================
           CONTROLES
        ================================================== */

        .controls {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 15px;
        }


        button {

            border: 0;

            border-radius: 10px;

            padding:
                11px 16px;

            font-size: 0.95rem;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }


        button:hover {

            transform:
                translateY(-1px);
        }


        button:active {

            transform:
                translateY(1px);
        }


        .cut-button {

            background:
                #dc2626;

            color: white;

            flex: 1;
        }


        .pause-button {

            background:
                #374151;

            color: white;

            flex: 1;
        }


        .resume-button {

            background:
                #16a34a;

            color: white;

            flex: 1;
        }


        /* ==================================================
           INFO
        ================================================== */

        .live-info {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 10px;

            margin-top: 15px;
        }


        .info-card {

            background:
                #1f2937;

            border:
                1px solid #334155;

            border-radius: 10px;

            padding:
                10px 12px;
        }


        .info-label {

            font-size: 0.75rem;

            color: #94a3b8;

            text-transform:
                uppercase;

            margin-bottom: 4px;
        }


        .info-value {

            font-size: 1rem;

            color: white;

            font-weight: 700;
        }


        /* ==================================================
           CONVERSACIÓN
        ================================================== */

        .conversation {

            flex: 1;

            padding:
                22px 15px 100px;

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .empty {

            margin: auto;

            text-align: center;

            color: #64748b;

            padding: 40px;
        }


        .message-wrapper {

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            animation:
                messageIn 0.25s
                ease-out;
        }


        @keyframes messageIn {

            from {

                opacity: 0;

                transform:
                    translateY(10px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }
        }


        .message-meta {

            display: flex;

            align-items: center;

            gap: 8px;

            margin:
                0 0 6px 12px;

            font-size: 0.78rem;

            color: #94a3b8;
        }


        .new-badge {

            background:
                #2563eb;

            color: white;

            border-radius:
                999px;

            padding:
                2px 8px;

            font-size:
                0.68rem;

            font-weight: 800;
        }


        .message {

            max-width: min(
                850px,
                92%
            );

            background:
                #1e293b;

            border:
                1px solid #334155;

            border-radius:
                14px;

            border-top-left-radius:
                4px;

            padding:
                15px 17px;

            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.18
                );
        }


        .message.new {

            border:
                1px solid #2563eb;

            box-shadow:
                0 0 0 1px
                rgba(
                    37,
                    99,
                    235,
                    0.15
                );
        }


        .message-text {

            color: #f8fafc;

            font-size:
                1.12rem;

            line-height:
                1.65;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .footer {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 20;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.94
                );

            backdrop-filter:
                blur(10px);

            border-top:
                1px solid #263244;

            padding:
                10px 15px;
        }


        .footer-inner {

            width: min(
                1000px,
                100%
            );

            margin: auto;

            text-align: center;

            color: #64748b;

            font-size:
                0.76rem;
        }


        @media (
            max-width: 650px
        ) {

            .live-info {

                grid-template-columns:
                    1fr;

            }


            .message-text {

                font-size:
                    1rem;

            }


            .header-top {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }
        }

    </style>
</head>


<body>

<div class="app">


    <!-- ====================================================
         HEADER
    ===================================================== -->

    <header class="header">

        <div class="header-top">

            <div class="title">
                🎙️ Live Caption
            </div>


            <div class="status">

                <span
                    class="status-dot"
                    id="statusDot"
                ></span>

                <span
                    id="statusText"
                >
                    Iniciando...
                </span>

            </div>

        </div>


        <!-- =================================================
             CONTROLES
        ================================================== -->

        <div class="controls">

            <button
                class="cut-button"
                id="cutButton"
            >
                🔴 TERMINAR SEGMENTO
            </button>


            <button
                class="pause-button"
                id="pauseButton"
            >
                🔇 PAUSAR ESCUCHA
            </button>


            <button
                class="resume-button"
                id="resumeButton"
                style="display: none;"
            >
                ▶ REANUDAR ESCUCHA
            </button>

        </div>


        <!-- =================================================
             INFORMACIÓN
        ================================================== -->

        <div class="live-info">

            <div class="info-card">

                <div class="info-label">
                    Estado
                </div>

                <div
                    class="info-value"
                    id="stateValue"
                >
                    Iniciando
                </div>

            </div>


            <div class="info-card">

                <div class="info-label">
                    Segmento actual
                </div>

                <div
                    class="info-value"
                    id="durationValue"
                >
                    0.0 s
                </div>

            </div>


            <div class="info-card">

                <div class="info-label">
                    En cola
                </div>

                <div
                    class="info-value"
                    id="queueValue"
                >
                    0
                </div>

            </div>

        </div>

    </header>


    <!-- ====================================================
         CONVERSACIÓN
    ===================================================== -->

    <main
        class="conversation"
        id="conversation"
    >

        <div
            class="empty"
            id="emptyState"
        >
            🎧 Esperando la primera intervención...
        </div>

    </main>


</div>


<!-- ========================================================
     FOOTER
========================================================= -->

<footer class="footer">

    <div class="footer-inner">

        Live Caption · faster-whisper · CUDA · VAD

    </div>

</footer>


<script>

    const conversation =
        document.getElementById(
            "conversation"
        );


    const emptyState =
        document.getElementById(
            "emptyState"
        );


    const statusDot =
        document.getElementById(
            "statusDot"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const stateValue =
        document.getElementById(
            "stateValue"
        );


    const durationValue =
        document.getElementById(
            "durationValue"
        );


    const queueValue =
        document.getElementById(
            "queueValue"
        );


    const cutButton =
        document.getElementById(
            "cutButton"
        );


    const pauseButton =
        document.getElementById(
            "pauseButton"
        );


    const resumeButton =
        document.getElementById(
            "resumeButton"
        );


    let lastSegmentId = null;


    // ======================================================
    // ESTADO
    // ======================================================

    function updateStatus(
        data
    ) {

        const state =
            data.state || "unknown";


        const messages = {

            listening:
                "🟢 ESCUCHANDO",

            transcribing:
                "🟡 TRANSCRIBIENDO",

            paused:
                "🔵 ESCUCHA PAUSADA",

            error:
                "🔴 ERROR",

            starting:
                "⏳ INICIANDO"

        };


        const readable =
            messages[state]
            || data.message
            || "Estado desconocido";


        statusText.textContent =
            readable;


        statusDot.className =
            "status-dot";


        if (
            state === "transcribing"
        ) {

            statusDot.classList.add(
                "transcribing"
            );

        }


        if (
            state === "paused"
        ) {

            statusDot.classList.add(
                "paused"
            );

        }


        if (
            state === "error"
        ) {

            statusDot.classList.add(
                "error"
            );

        }


        stateValue.textContent =
            data.message
            || readable;


        durationValue.textContent =
            `${Number(
                data.segment_duration
                || 0
            ).toFixed(1)} s`;


        queueValue.textContent =
            `${data.queue_size || 0}`;


        if (
            state === "paused"
        ) {

            pauseButton.style.display =
                "none";

            resumeButton.style.display =
                "block";

        } else {

            pauseButton.style.display =
                "block";

            resumeButton.style.display =
                "none";

        }

    }


    // ======================================================
    // HISTORIAL
    // ======================================================

    function updateHistory(
        transcriptions
    ) {

        if (
            !transcriptions.length
        ) {

            emptyState.style.display =
                "block";

            return;

        }


        emptyState.style.display =
            "none";


        conversation.innerHTML = "";


        transcriptions.forEach(
            (
                item,
                index
            ) => {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "message-wrapper";


                const meta =
                    document.createElement(
                        "div"
                    );


                meta.className =
                    "message-meta";


                const time =
                    document.createElement(
                        "span"
                    );


                time.textContent =
                    item.timestamp
                    || "--:--";


                const duration =
                    document.createElement(
                        "span"
                    );


                duration.textContent =
                    `· ${Number(
                        item.duration
                        || 0
                    ).toFixed(1)} s`;


                meta.appendChild(
                    time
                );


                meta.appendChild(
                    duration
                );


                if (
                    item.segment_id
                    === lastSegmentId
                ) {

                    const badge =
                        document.createElement(
                            "span"
                        );

                    badge.className =
                        "new-badge";

                    badge.textContent =
                        "NUEVO";

                    meta.appendChild(
                        badge
                    );

                }


                const message =
                    document.createElement(
                        "div"
                    );


                message.className =
                    "message";


                if (
                    item.segment_id
                    === lastSegmentId
                ) {

                    message.classList.add(
                        "new"
                    );

                }


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "message-text";


                text.textContent =
                    item.text;


                message.appendChild(
                    text
                );


                wrapper.appendChild(
                    meta
                );


                wrapper.appendChild(
                    message
                );


                conversation.appendChild(
                    wrapper
                );

            }
        );


        conversation.scrollTop =
            conversation.scrollHeight;

    }


    // ======================================================
    // CARGAR HISTORIAL
    // ======================================================

    async function loadTranscriptions() {

        try {

            const response =
                await fetch(
                    "/api/transcriptions"
                );


            if (
                !response.ok
            ) {
                return;
            }


            const data =
                await response.json();


            updateHistory(
                data
            );


        } catch (error) {

            console.error(
                "Error cargando historial:",
                error
            );

        }

    }


    // ======================================================
    // CARGAR ESTADO
    // ======================================================

    async function loadStatus() {

        try {

            const response =
                await fetch(
                    "/api/status"
                );


            if (
                !response.ok
            ) {
                return;
            }


            const data =
                await response.json();


            updateStatus(
                data
            );


        } catch (error) {

            statusText.textContent =
                "🔴 SERVIDOR NO DISPONIBLE";

            statusDot.className =
                "status-dot error";

        }

    }


    // ======================================================
    // CONTROL
    // ======================================================

    async function sendControl(
        action
    ) {

        try {

            await fetch(
                "/api/control",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action:
                                action
                        })

                }
            );

        } catch (error) {

            console.error(
                "Error enviando control:",
                error
            );

        }

    }


    // ======================================================
    // BOTÓN: TERMINAR SEGMENTO
    // ======================================================

    cutButton.addEventListener(
        "click",
        async () => {

            cutButton.disabled =
                true;

            cutButton.textContent =
                "🔴 CORTANDO...";


            await sendControl(
                "force_cut"
            );


            setTimeout(
                () => {

                    cutButton.disabled =
                        false;

                    cutButton.textContent =
                        "🔴 TERMINAR SEGMENTO";

                },
                500
            );

        }
    );


    // ======================================================
    // BOTÓN: PAUSAR
    // ======================================================

    pauseButton.addEventListener(
        "click",
        async () => {

            await sendControl(
                "pause"
            );

            setTimeout(
                loadStatus,
                100
            );

        }
    );


    // ======================================================
    // BOTÓN: REANUDAR
    // ======================================================

    resumeButton.addEventListener(
        "click",
        async () => {

            await sendControl(
                "resume"
            );

            setTimeout(
                loadStatus,
                100
            );

        }
    );


    // ======================================================
    // DETECTAR NUEVO SEGMENTO
    // ======================================================

    async function refreshHistory() {

        try {

            const response =
                await fetch(
                    "/api/transcriptions"
                );


            if (
                !response.ok
            ) {
                return;
            }


            const data =
                await response.json();


            if (
                data.length > 0
            ) {

                const latest =
                    data[
                        data.length - 1
                    ];


                const latestId =
                    latest.segment_id;


                if (
                    latestId
                    !== lastSegmentId
                ) {

                    lastSegmentId =
                        latestId;

                    updateHistory(
                        data
                    );

                }

            } else {

                updateHistory(
                    data
                );

            }

        } catch (error) {

            console.error(
                error
            );

        }

    }


    // ======================================================
    // INICIO
    // ======================================================

    loadStatus();
    loadTranscriptions();


    setInterval(
        loadStatus,
        500
    );


    setInterval(
        refreshHistory,
        1000
    );

</script>

</body>

</html>
